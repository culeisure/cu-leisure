<script>
(function(){
"use strict";
var SALT="9756625b94e4c106081dc02eaf393c93",IT=600000;
var $=function(s){return document.querySelector(s)};
function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function key(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(SALT),iterations:IT,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"])})}
function dec(k,u){return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k,u.slice(12))}
function bar(p){var b=$("#gate .bar");b.hidden=false;b.firstChild.style.width=Math.round(p*100)+"%"}
async function unlock(pw){
  var k=await key(pw),pl;
  try{pl=JSON.parse(new TextDecoder().decode(await dec(k,b64($("#payload").textContent.trim()))))}catch(e){return false}
  var map=pl.map,amap={},list=Object.keys(map).filter(function(p){return !/\.pdf$/.test(p)}),done=0;
  $("#msg").textContent="자료를 여는 중";bar(0);
  await Promise.all(list.map(async function(p){
    var r=await fetch("d/"+map[p].n,{cache:"force-cache"});var b=await dec(k,new Uint8Array(await r.arrayBuffer()));
    amap[p]=URL.createObjectURL(new Blob([b],{type:map[p].t}));done++;bar(done/list.length)}));
  window.__amap=amap;
  var body=pl.body.replace(/(\s)(src)="(img\/[^"]+)"/g,function(s,sp,a,p){return amap[p]?sp+a+'="'+amap[p]+'"':s});
  try{sessionStorage.setItem("cu_gs",pw)}catch(e){}
  document.title=pl.title;
  var st=document.createElement("style");st.textContent=pl.css;document.head.appendChild(st);
  $("#gate").remove();$("#payload").remove();
  var holder=document.createElement("div");holder.innerHTML=body;
  while(holder.firstChild)document.body.appendChild(holder.firstChild);
  window.__pdfs={};Object.keys(map).filter(function(p){return /^pdf\//.test(p)}).forEach(function(pk){
    fetch("d/"+map[pk].n).then(function(r){return r.arrayBuffer()}).then(function(b){return dec(k,new Uint8Array(b))}).then(function(b){
      window.__pdfs[pk.slice(4)]=URL.createObjectURL(new Blob([b],{type:"application/pdf"}))})});
  var sc=document.createElement("script");sc.textContent=pl.js;document.body.appendChild(sc);
  return true}
var form=$("#gate form"),inp=$("#pw"),btn=$("#go");
async function tryOpen(pw,quiet){
  btn.disabled=true;$("#msg").textContent="확인 중";
  var ok=false;try{ok=await unlock(pw)}catch(e){ok=false}
  if(!ok){btn.disabled=false;$("#msg").textContent=quiet?"":"비밀번호가 맞지 않습니다";try{sessionStorage.removeItem("cu_gs")}catch(e){};inp.focus()}}
form.addEventListener("submit",function(e){e.preventDefault();tryOpen(inp.value,false)});
var saved=null;try{saved=sessionStorage.getItem("cu_gs")}catch(e){}
if(saved)tryOpen(saved,true);else inp.focus();
})();
</script>
